[package]
name = "xgtools"
version = "0.9.0"
description = "A Tools"
authors = ["xxg"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xgtools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
tauri-plugin-store = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-process = "2.3.1"
arboard = "3.4"
image = "0.25"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time"] }
xcap = "0.0.14"
rtree_rs = "0.1.4"
atree = "0.5.2"
rayon = "1.10"
thiserror = "2"
dirs = "6"

# 录屏要抓「电脑正在放的声音」。ffmpeg 在 Windows 上做不到（它只有 dshow，
# 而 dshow 只认录音设备），只能自己走 WASAPI 的回环采集。详见 audio_loopback.rs
wasapi = "0.24"
paddle-ocr-rs = "0.6"
ort = { version = "=2.0.0-rc.10", default-features = false }
num_cpus = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
futures-util = "0.3"
# 笔记删错了没有 Ctrl+Z,所以删除一律走系统回收站而不是 remove_file
trash = "5"
# DSH 的会话事件流只走 WebSocket。用 rustls 而不是 native-tls,
# 和 reqwest 保持同一套 TLS 后端,免得同一个二进制里塞两份。
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# 中文 Windows 的控制台代码页是 GBK,子进程输出的中文路径不是 UTF-8。
# 只在 Windows 上用得到,但依赖树里 reqwest 本来就带着它,不额外增加体积。
encoding_rs = "0.8"
zip = "2"
urlencoding = "2"
notify = "8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "winuser", "wingdi", "combaseapi", "objbase", "commoncontrols", "shobjidl_core", "libloaderapi", "unknwnbase", "minwinbase", "wtypesbase", "objidl"] }
lnk = "0.5"
window-vibrancy = "0.5"
# Win32_System_Com / _Variant / _Ole:查 Windows 索引要走 ADO 的晚绑定调用
# (Search.CollatorDSO 这个 OLE DB 提供程序),见 file_search_commands.rs
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_SystemInformation"] }
uiautomation = "0.24"
clipboard-win = "5"

# 所有第三方包开优化（参考 Snow-Shot），否则 ONNX Runtime 在 dev 模式下极慢
[profile.dev.package."*"]
opt-level = 2
