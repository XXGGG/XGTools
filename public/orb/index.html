<!doctype html>
<!--
  Storm Orb 渲染引擎(XGTools 内置)— 原创风暴粒子球
  从零手写:GPGPU(GPUComputationRenderer, MIT)+ curl noise(simplex noise, 公共领域技术)。
  不含、不派生自任何第三方艺术作品代码。控制面板在 Vue 侧(StormOrb.vue),经 postMessage 驱动。
-->
<html>
<head>
<meta charset="utf-8" />
<title>Storm Orb</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  #app{position:fixed;inset:0}
  #app canvas{display:block}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" }}
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as THREE from "three";
import { GPUComputationRenderer } from "./vendor/GPUComputationRenderer.js";

// ---------- 参数 ----------
const P = {
  radius: 1.0, coreR: 0.5, coreFrac: 0.22, haloFrac: 0.3,
  freq: 1.0, swirl: 0.35, turb: 0.62, pull: 2.3,
  speed: 1.0, spin: 0.05, pointSize: 1.25, bright: 0.55, follow: 1.0,
  color: new THREE.Color(0.85, 0.9, 1.0),
  bg: new THREE.Color(0, 0, 0),
};
const COUNTS = { 低: 460, 中: 640, 高: 820 };
let widthKey = "高";
const NUM_KEYS = ["radius","coreR","coreFrac","haloFrac","freq","swirl","turb","pull","speed","spin","pointSize","bright","follow"];

// ---------- URL 参数(全屏/壁纸/屏保传入)----------
const Q = new URLSearchParams(location.search);
(function applyUrl(){
  NUM_KEYS.forEach(k=>{ if(Q.has(k)){ const v=parseFloat(Q.get(k)); if(!isNaN(v)) P[k]=v; } });
  if(Q.has("color")) P.color.set(Q.get("color"));
  if(Q.has("bg")) P.bg.set(Q.get("bg"));
  if(Q.has("density") && COUNTS[Q.get("density")]) widthKey = Q.get("density");
})();
window.__stormQuery = () => {
  const p = new URLSearchParams();
  NUM_KEYS.forEach(k=>p.set(k, +P[k].toFixed(4)));
  p.set("color", "#"+P.color.getHexString());
  p.set("bg", "#"+P.bg.getHexString());
  p.set("density", widthKey);
  return p.toString();
};

// ---------- 接收 Vue 面板的参数补丁 ----------
function applyPatch(p){
  if(!p) return;
  NUM_KEYS.forEach(k=>{ if(typeof p[k]==="number") P[k]=p[k]; });
  if(p.color) P.color.set(p.color);
  if(p.bg) P.bg.set(p.bg);
  if(p.density && COUNTS[p.density] && p.density!==widthKey){ widthKey=p.density; build(); }
}
addEventListener("message", e=>{
  const m = e.data && e.data.__storm;
  if(m){ if(m.patch) applyPatch(m.patch); if(m.close!==undefined){ /* fullscreen close handled by host */ } }
});
// 全屏窗口里 Esc → 通知父窗关闭
addEventListener("keydown", e=>{ if(e.key==="Escape"){ try{ parent.postMessage({__storm:"close"},"*"); }catch(_){ } } });

// ---------- Three ----------
const host = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 3.73); // 球占画布 ~72%,四周留边看飘离粒子
let lastVW = 0, lastVH = 0;
function fit(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); lastVW=w; lastVH=h; }
addEventListener("resize", fit); fit();

// ---------- 噪声 + curl ----------
const NOISE = `
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;i=mod(i,289.0);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}
vec3 snoiseVec3(vec3 x){return vec3(snoise(x),snoise(x+vec3(137.1,231.7,-97.3)),snoise(x+vec3(-311.7,49.2,183.9)));}
vec3 curl(vec3 p){const float e=0.12;vec3 dx=vec3(e,0.,0.),dy=vec3(0.,e,0.),dz=vec3(0.,0.,e);
  vec3 x0=snoiseVec3(p-dx),x1=snoiseVec3(p+dx),y0=snoiseVec3(p-dy),y1=snoiseVec3(p+dy),z0=snoiseVec3(p-dz),z1=snoiseVec3(p+dz);
  return normalize(vec3(y1.z-y0.z-z1.y+z0.y,z1.x-z0.x-x1.z+x0.z,x1.y-x0.y-y1.x+y0.x)/(2.0*e));}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
`;
const SIM = NOISE + `
uniform float uTime,uDelta,uSpeed,uFreq,uSwirl,uTurb,uPull,uRadius,uCoreR,uCoreFrac,uHaloFrac;
void main(){
  vec2 uv=gl_FragCoord.xy/resolution.xy;
  vec4 t=texture2D(texturePosition,uv);
  vec3 pos=t.xyz; float life=t.w;
  float grp=hash(uv+100.0);
  float shellR=uRadius, pullMul=1.7, turbMul=0.42;
  if(grp<uCoreFrac){ shellR=uCoreR; pullMul=1.5; turbMul=0.5; }
  else if(grp>1.0-uHaloFrac){ pullMul=0.4; turbMul=1.7; }
  float r=length(pos)+1e-5;
  vec3 nrm=pos/r;
  vec3 c=curl(pos*uFreq+vec3(0.0,uTime*0.05,0.0));
  vec3 tang=c-nrm*dot(c,nrm);
  vec3 vel=(tang+nrm*dot(c,nrm)*0.5)*uTurb*turbMul;
  vel+=vec3(-pos.z,0.0,pos.x)*uSwirl;
  vel-=nrm*(r-shellR)*uPull*pullMul;
  pos+=vel*uDelta*uSpeed;
  life-=uDelta*uSpeed*0.09;
  if(life<=0.0){
    vec3 d=normalize(vec3(hash(uv+uTime),hash(uv+uTime+7.0),hash(uv+uTime+13.0))*2.0-1.0);
    pos=d*shellR*(0.95+0.09*hash(uv+3.1));
    life=0.8+3.2*hash(uv+5.3);
  }
  gl_FragColor=vec4(pos,life);
}`;

let gpu, posVar, points, mat, WIDTH, COUNT;
function build(){
  if(points){ scene.remove(points); points.geometry.dispose(); mat.dispose(); }
  WIDTH=COUNTS[widthKey]; COUNT=WIDTH*WIDTH;
  gpu=new GPUComputationRenderer(WIDTH,WIDTH,renderer);
  const dt=gpu.createTexture(), a=dt.image.data;
  for(let i=0;i<COUNT;i++){
    let x=Math.random()*2-1,y=Math.random()*2-1,z=Math.random()*2-1,l=Math.hypot(x,y,z)||1;
    const sh=Math.random()<P.coreFrac?P.coreR:P.radius;
    const r=sh*(0.94+0.12*Math.random());
    a[i*4]=x/l*r; a[i*4+1]=y/l*r; a[i*4+2]=z/l*r; a[i*4+3]=0.4+3.2*Math.random();
  }
  posVar=gpu.addVariable("texturePosition",SIM,dt);
  gpu.setVariableDependencies(posVar,[posVar]);
  Object.assign(posVar.material.uniforms,{
    uTime:{value:0},uDelta:{value:0},uSpeed:{value:P.speed},uFreq:{value:P.freq},
    uSwirl:{value:P.swirl},uTurb:{value:P.turb},uPull:{value:P.pull},uRadius:{value:P.radius},
    uCoreR:{value:P.coreR},uCoreFrac:{value:P.coreFrac},uHaloFrac:{value:P.haloFrac},
  });
  const e=gpu.init(); if(e)console.error(e);
  const refs=new Float32Array(COUNT*2);
  for(let i=0;i<COUNT;i++){ refs[i*2]=(i%WIDTH)/WIDTH; refs[i*2+1]=((i/WIDTH)|0)/WIDTH; }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(COUNT*3),3));
  geo.setAttribute("reference",new THREE.BufferAttribute(refs,2));
  mat=new THREE.ShaderMaterial({
    uniforms:{texturePosition:{value:null},uPointSize:{value:P.pointSize*renderer.getPixelRatio()},uColor:{value:P.color},uBright:{value:P.bright}},
    vertexShader:`uniform sampler2D texturePosition;uniform float uPointSize;attribute vec2 reference;varying float vLife;
      void main(){vec4 p=texture2D(texturePosition,reference);vLife=p.w;
        vec4 mv=modelViewMatrix*vec4(p.xyz,1.0);gl_PointSize=uPointSize*(2.6/-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`precision highp float;varying float vLife;uniform vec3 uColor;uniform float uBright;
      void main(){vec2 c=gl_PointCoord-0.5;float d=length(c);if(d>0.5)discard;
        float a=smoothstep(0.5,0.0,d)*clamp(vLife,0.0,1.0);gl_FragColor=vec4(uColor,a*uBright);}`,
    transparent:true,blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,
  });
  points=new THREE.Points(geo,mat); points.frustumCulled=false; scene.add(points);
}
build();

// ---------- 窗口跟随甩动 ----------
let ox=0,oy=0,vx=0,vy=0,lastSX=null,lastSY=null;
function windowForce(){
  const sx=window.screenX, sy=window.screenY;
  if(lastSX!==null){ let dx=sx-lastSX, dy=sy-lastSY;
    if(Math.abs(dx)<500 && Math.abs(dy)<500){ vx+=-dx*0.0011*P.follow; vy+=+dy*0.0011*P.follow; } }
  lastSX=sx; lastSY=sy;
  vx+=-ox*0.025; vy+=-oy*0.025; vx*=0.9; vy*=0.9; ox+=vx; oy+=vy;
  points.position.set(ox,oy,0);
}

// ---------- 循环 ----------
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if(innerWidth!==lastVW||innerHeight!==lastVH) fit();
  const dt=Math.min(clock.getDelta(),0.033);
  const u=posVar.material.uniforms;
  u.uTime.value+=dt; u.uDelta.value=dt; u.uSpeed.value=P.speed; u.uFreq.value=P.freq;
  u.uSwirl.value=P.swirl; u.uTurb.value=P.turb; u.uPull.value=P.pull;
  u.uCoreR.value=P.coreR; u.uCoreFrac.value=P.coreFrac; u.uHaloFrac.value=P.haloFrac;
  gpu.compute();
  mat.uniforms.texturePosition.value=gpu.getCurrentRenderTarget(posVar).texture;
  mat.uniforms.uColor.value=P.color; mat.uniforms.uBright.value=P.bright;
  mat.uniforms.uPointSize.value=P.pointSize*renderer.getPixelRatio();
  points.rotation.y+=dt*P.spin;
  windowForce();
  renderer.setClearColor(P.bg,1);
  renderer.render(scene,camera);
}
animate();

// 就绪后通知父窗(Vue 可在此推送初始参数)
try{ parent.postMessage({__storm:"ready"},"*"); }catch(_){ }
</script>
</body>
</html>
